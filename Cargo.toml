[package]
name = "passport-superposition-so"
version = "0.1.0"
edition = "2024"

[lib]
name = "libpassport"

[[bin]]
name = "contract-solver"
path = "src/contract-solver/main.rs"

[[bin]]
name = "contract-setter"
path = "src/contract-setter/main.rs"
required-features = ["storage-gen-apply"]

[[bin]]
name = "contract-admin"
path = "src/contract-admin/main.rs"
required-features = ["storage-gen-admin"]

[[bin]]
name = "contract-vault"
path = "src/contract-vault/main.rs"

[[bin]]
name = "contract-apply"
path = "src/contract-apply/main.rs"
required-features = ["storage-gen-apply"]

[[bin]]
name = "webapp"
path = "src/webapp-main/main.rs"
required-features = ["std"]

[[bin]]
name = "passport-cli"
path = "src/passport-cli/main.rs"
required-features = ["std"]

[profile.release]
codegen-units = 1
opt-level = "z"
strip = true
lto = true
debug = false
rpath = false
debug-assertions = false
incremental = false

[profile.dev]
codegen-units = 1
panic = "unwind"
opt-level = "z"
incremental = false

[dependencies]
array-concat = "0.5.3"
borsh = { version = "1.5.5", default-features = false, features = ["derive"] }
const-hex = { version = "1.17.0", default-features = false }
lzss = { version = "0.9.1", features = ["alloc", "safe"], default-features = false }
mini-alloc = "0.7.0"
mutants = "0.0.3"
sha2 = { version = "0.10.9", default-features = false }
subtle = { version = "2.6.1", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["digest"] }
cfg-if = "1.0.3"
num_enum = { version = "0.7.4", default-features = false }
bobcat-sdk  = { version = "0.7.28", features = ["borsh", "alloc", "serde"] }
serde = { version = "1.0.228", optional = true }
serde-big-array = { version = "0.5.1", optional = true }
serde_sexpr = { version = "0.1.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proptest-derive = "0.6.0"
proptest = "1.5.0"
arbitrary = { version = "1.4.1", features = ["derive"] }
clap = { version = "4.5.46", features = ["derive"] }

[dev-dependencies]
const-hex = { version = "1.12.0", features = ["alloc"] }
bobcat-sdk = { version = "0.7.28", features = ["std", "borsh", "alloc", "serde", "panic-revert", "alloy-enabled", "ed25519-dalek"] }

[features]
std = [
	"derive-extras",
	"errors-extra-context",
	"bobcat-sdk/std",
	"bobcat-sdk/ed25519-dalek",
	"dep:serde",
	"dep:serde-big-array",
	"dep:serde_sexpr",
]
dryrun = []
derive-extras = []
errors-extra-context = []
harness-stylus-interpreter = ["errors-extra-context"]
e2e-adjust-time = []
contract-client-gen = []
network-mainnet = []
network-testnet = []
network-custom = []
storage-gen-admin = []
storage-gen-apply = []
tracing = ["std"]
# Enable the bobcat panic handler
panic = ["bobcat-sdk/panic-revert"]
# Support web WASM target without Stylus VM features
web = [
	"bobcat-sdk/alloy-enabled",
	"bobcat-sdk/dont-define-symbols",
]
